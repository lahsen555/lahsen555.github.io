<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>

    <!-- 1. The Amiri Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <!-- 2. MathJax for LaTeX -->
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        body {
            font-family: 'Amiri', serif;
            background-color: #fdfdfd;
            color: #111;
            line-height: 1.8;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            font-size: 22px;
        }
        
        /* Make English words inside Arabic text look normal */
        p, li { text-align: justify; }
        
        /* Code blocks need to be LTR even in an RTL site */
        pre, code {
            direction: ltr;
            text-align: left;
            font-family: 'Courier New', monospace;
            background: #f4f4f4;
            padding: 2px 5px;
            border-radius: 3px;
        }

        a { color: #0066cc; text-decoration: none; }
        a:hover { text-decoration: underline; }
        
        header { margin-bottom: 40px; border-bottom: 1px solid #eee; padding-bottom: 20px; }
    </style>
</head>
<body>

    <header>
        <h1><a href="/" style="color: inherit;">{{ site.title }}</a></h1>
        <p>{{ site.description }}</p>
    </header>

    <article>
        <!-- This is where Jekyll will paste your post content -->
        {{ content }}
    </article>

</body>
</html>
