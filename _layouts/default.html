<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>

    <!-- TRICK 1: Pre-connect to the servers to save time -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">

    <!-- TRICK 2: Use display=swap so text appears BEFORE the font loads -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <!-- TRICK 3: Optimized MathJax (Async) -->
    <script>
    MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
      },
      svg: {
        fontCache: 'global'
      }
    };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>

    <style>
        body {
            /* Fallback to 'Times New Roman' until Amiri loads */
            font-family: 'Amiri', 'Times New Roman', serif;
            background-color: #fdfdfd;
            color: #111;
            line-height: 1.8;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            font-size: 22px;
        }
        
        /* Loading animation for math */
        mjx-container[jax="CHTML"][display="true"] {
             margin: 1em 0;
        }

        p, li { text-align: justify; }
        
        pre, code {
            direction: ltr;
            text-align: left;
            font-family: 'Courier New', monospace;
            background: #f4f4f4;
            padding: 2px 5px;
            border-radius: 3px;
        }

        a { color: #0066cc; text-decoration: none; }
        a:hover { text-decoration: underline; }
        
        header { margin-bottom: 40px; border-bottom: 1px solid #eee; padding-bottom: 20px; }
    </style>
</head>
<body>

    <header>
        <h1><a href="/" style="color: inherit;">{{ site.title }}</a></h1>
        <p>{{ site.description }}</p>
    </header>

    <article>
        {{ content }}
    </article>

</body>
</html>
